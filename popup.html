<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="head">
    <span class="logo">💊</span>
    <div>
      <div class="title">MediTrack BD</div>
      <div class="sub">Medicine inventory</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="p-total">–</div><div class="lbl">Medicines</div></div>
    <div class="stat warn"><div class="num" id="p-low">–</div><div class="lbl">Low stock</div></div>
    <div class="stat danger"><div class="num" id="p-expiring">–</div><div class="lbl">Expiring</div></div>
  </div>
  <div id="p-flash" class="flash"></div>
  <button id="p-open">Open full app</button>
  <button id="p-check" class="ghost">Check alerts now</button>
  <div class="foot">Data sourced from <a href="https://medex.com.bd" target="_blank" rel="noreferrer">medex.com.bd</a></div>
  <script src="popup.js"></script>
</body>
</html>
